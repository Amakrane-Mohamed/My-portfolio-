<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#E8E8E8" />
    <title>Mohamed Amakrane</title>
    <meta name="description" content="Mohamed Amakrane. Creative developer. Native iOS and Android." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('med-theme')
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme
            document.documentElement.style.colorScheme = theme
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#1c1c1e' : '#E8E8E8')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
